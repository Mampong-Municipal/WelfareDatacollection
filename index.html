<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voters Verification — Closed</title>
  <style>
    :root{
      --bg1:#0f172a; /* deep indigo */
      --bg2:#081129; /* darker */
      --accent:#ff6b6b;
      --text:#ffffff;
      --muted:#d1d5db;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: radial-gradient(1000px 600px at 10% 10%, rgba(255,107,107,0.06), transparent), linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text); display:flex; align-items:center; justify-content:center; padding:24px;
    }

    .card{
      width:100%; max-width:860px; background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.06); border-radius:18px; padding:40px; text-align:center; box-shadow:0 10px 30px rgba(2,6,23,0.6);
    }

    .emojis{
      font-size:5.5rem; line-height:1; display:flex; gap:18px; justify-content:center; margin-bottom:22px;
    }

    /* subtle animation for crying emojis */
    .emoji{display:inline-block; transform-origin:center; animation:float 2.4s ease-in-out infinite;}
    .emoji:nth-child(2){animation-delay:0.08s}
    .emoji:nth-child(3){animation-delay:0.16s}

    @keyframes float{
      0%{transform:translateY(0) rotate(-2deg)}
      50%{transform:translateY(-8px) rotate(2deg)}
      100%{transform:translateY(0) rotate(-2deg)}
    }

    h1{font-size:clamp(28px,4.2vw,44px); margin:0 0 8px; letter-spacing: -0.02em}
    p.lead{margin:0 0 18px; color:var(--muted); font-size:16px}

    .notice{
      display:inline-block; padding:12px 18px; border-radius:10px; background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,107,107,0.12); color:var(--accent); font-weight:600; box-shadow:0 6px 18px rgba(255,107,107,0.06)
    }

    .actions{margin-top:22px}
    .btn{
      display:inline-block; padding:10px 16px; border-radius:10px; text-decoration:none; font-weight:600; border:1px solid rgba(255,255,255,0.06);
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); color:var(--text);
    }
    .btn.secondary{margin-left:12px; color:var(--muted); background:transparent}

    footer{margin-top:22px; color:rgba(255,255,255,0.24); font-size:13px}

    @media (max-width:520px){
      .emojis{font-size:3.4rem}
      .card{padding:24px}
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <div class="emojis" aria-hidden="true">
      <span class="emoji">😭</span>
      <span class="emoji">😢</span>
      <span class="emoji">😭</span>
    </div>

    <h1 id="title">Voters Verification is closed</h1>
    <p class="lead">Thank you for your interest. The verification window has ended and is no longer accepting entries.</p>

    

    

    
  </main>
</body>
</html>
